<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self';">
<meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self), geolocation=(self)">
<title>Atendimento Técnico — TAAG</title>

<!-- fontes: Space Grotesk (títulos/números) + Inter (corpo de texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- geração de PDF do relatório final (RF-07) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- estilos do app, em arquivo próprio (mesma pasta do index.html) -->
<link rel="stylesheet" href="style.css?v=20260915-2">
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Carregando o sistema">
  <img src="Taag30.png" alt="TAAG 30 anos">
  <div class="scan"></div>
</div>

<div class="phone-frame" id="phoneFrame">
  <div class="notch"></div>

  <div class="status-bar">
    <span id="clock">—</span>
    <div class="icons">
      <span id="connectionStatus" title="Estado de conexão informado pelo navegador">Rede —</span>
      <span id="batteryStatus" title="Bateria indisponível neste navegador">Bateria —</span>
      <button class="device-info-btn" id="deviceInfo" type="button" aria-label="Informações dos indicadores do aparelho" aria-expanded="false">i</button>
    </div>
  </div>
  <div id="deviceHelp" class="device-help" hidden>O horário acompanha seu aparelho. Bateria disponível somente nos navegadores compatíveis; se aparecer “—”, consulte a barra do celular. A conexão indica Online/Offline, não as barras de sinal da operadora. As notificações do sistema aparecem no sino enquanto o app está aberto.</div>

  <div id="app"></div>
  <footer id="sessionActions" class="session-actions" aria-label="Ações do sistema" hidden>
    <div class="session-secondary"><button id="sessionLogout" class="session-logout" hidden type="button">Sair do sistema</button></div>
  </footer>
  <div id="toast"></div>
</div>

<!-- lógica do app, em arquivo próprio (mesma pasta do index.html) -->
<script src="device-status.js?v=20260915-2"></script>
<script src="report.js?v=20260915-2"></script>
<script src="features.js?v=20260915-2"></script>
<script src="app.js?v=20260915-2"></script>
</body>
</html>
