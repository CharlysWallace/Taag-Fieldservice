<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self';">
<meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self), geolocation=(self)">
<title>Atendimento Técnico — TAAG</title>

<!-- fontes: Space Grotesk (títulos/números) + Inter (corpo de texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- geração de PDF do relatório final (RF-07) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- estilos do app, em arquivo próprio (mesma pasta do index.html) -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-frame" id="phoneFrame">
  <div class="notch"></div>

  <!-- splash: único momento de motion não-disparado por interação -->
  <div class="splash" id="splash">
    <img src="logo-taag.png" alt="TAAG">
    <div class="scan"></div>
  </div>

  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="icons">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M1 8L1 10M4.5 6L4.5 10M8 4L8 10M11.5 2L11.5 10M15 1L15 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="1" y="1" width="18" height="9" rx="2" stroke="currentColor" stroke-width="1.2"/><rect x="2.5" y="2.5" width="14" height="6" rx="1" fill="currentColor"/><path d="M21 4V7" stroke="currentColor" stroke-width="1.2"/></svg>
    </div>
  </div>

  <div id="app"></div>
  <div id="toast"></div>
</div>

<!-- lógica do app, em arquivo próprio (mesma pasta do index.html) -->
<script src="app.js"></script>
</body>
</html>
